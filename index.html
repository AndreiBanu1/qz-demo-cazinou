<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1433" />
    <!-- Runs before the stylesheet loads (spec §3.3): `js` lets CSS show the age gate only when JavaScript can close it,
         and `age-ok` hides it at once for a visitor who already answered yes in this tab. Touches <html> only. -->
    <script>document.documentElement.classList.add("js");try{if(sessionStorage.getItem("ametist-age-ok")==="1")document.documentElement.classList.add("age-ok")}catch(e){}</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Replaced per page at build time by scripts/prerender.mjs; these are the dev-server defaults. -->
    <!--seo-head-->
    <title>Salon Ametist</title>
    <meta name="robots" content="noindex" />
    <!--/seo-head-->
  </head>

  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
